name: Suwaya Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Install app dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install suwaya_time package dependencies
        working-directory: packages/suwaya_time
        run: dart pub get --enforce-lockfile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test packages/suwaya_time

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Analyze suwaya_time package
        working-directory: packages/suwaya_time
        run: dart analyze

      - name: Test suwaya_time package
        working-directory: packages/suwaya_time
        run: dart test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Verify Android release APK & AAB build (R8 & ProGuard check)
        env:
          ORG_GRADLE_PROJECT_allowDebugReleaseSign: "true"
        run: |
          flutter build apk --release --dart-define=REVENUECAT_GOOGLE_API_KEY=goog_JcnVefJVnUvvVCneWsmfNfOsMcL
          flutter build appbundle --release --dart-define=REVENUECAT_GOOGLE_API_KEY=goog_JcnVefJVnUvvVCneWsmfNfOsMcL