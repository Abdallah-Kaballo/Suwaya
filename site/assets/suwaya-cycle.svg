<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">مخطط التوقيت السُويعي: 12 سُويعة ليلية و12 سُويعة نهارية</title>
<desc id="desc">دورة تمثيلية تبدأ عند المغرب، تمر بالشروق، وتنتهي عند المغرب التالي. تتكون من اثنتي عشرة سُويعة ليلية واثنتي عشرة سُويعة نهارية. المخطط يوضح عدد الوحدات ولا يمثل طولها الفعلي بالدقائق المدنية.</desc>
<defs>
  <linearGradient id="night" x1="0" x2="1"><stop offset="0" stop-color="#203357"/><stop offset="1" stop-color="#384e7d"/></linearGradient>
  <linearGradient id="day" x1="0" x2="1"><stop offset="0" stop-color="#f2c766"/><stop offset="1" stop-color="#e9a93c"/></linearGradient>
</defs>
<rect x="2" y="2" width="1396" height="416" rx="28" fill="#151923" stroke="#6e6140" stroke-opacity=".65" stroke-width="2"/>
<text x="700" y="54" font-family="Tahoma, Arial, sans-serif" font-size="30" font-weight="700" fill="#f4f1e9" text-anchor="middle" direction="rtl">الدورة السُويعية: 24 سُويعة افتراضية</text>
<text x="700" y="86" font-family="Tahoma, Arial, sans-serif" font-size="18" fill="#b9bbc5" text-anchor="middle" direction="rtl">كل سُويعة = 60 دقيقة افتراضية، وليست بالضرورة 60 دقيقة مدنية</text>
<text x="365" y="128" font-family="Tahoma, Arial, sans-serif" font-size="23" font-weight="700" fill="#cbd8f4" text-anchor="middle" direction="rtl">12 سُويعة ليلية 🌑</text>
